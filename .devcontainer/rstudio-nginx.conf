# RStudio behind the Codespaces port proxy (2026-11-10). Once the browser holds the proxy's sign-in cookie, the
# proxy hands RStudio "Host: localhost:8787", so RStudio's sign-in redirect pointed the browser at
# https://localhost:8787/ ("This site can't be reached"). This relay sits on 8787 in front of RStudio (8788) and
# turns every absolute redirect into a relative one, which the browser resolves against the address it is on.
# Runs as the normal user; everything it writes goes to /tmp.
pid /tmp/rstudio-nginx.pid;
error_log /tmp/rstudio-nginx-error.log warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/rstudio-nginx-body;
  proxy_temp_path /tmp/rstudio-nginx-proxy;
  fastcgi_temp_path /tmp/rstudio-nginx-fastcgi;
  uwsgi_temp_path /tmp/rstudio-nginx-uwsgi;
  scgi_temp_path /tmp/rstudio-nginx-scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 0.0.0.0:8787;
    client_max_body_size 0;
    absolute_redirect off;   # keep the rewritten redirects relative (nginx would otherwise re-add localhost:8787)
    location / {
      proxy_pass http://127.0.0.1:8788;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1d;
      proxy_buffering off;
      proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }
  }
}
