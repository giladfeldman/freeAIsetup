[project]
name = "metascience-course"
version = "1.0.0"
description = "Python environment for the meta-science course"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "openpyxl>=3.1",
  "requests>=2.32",
  "pymupdf>=1.24",
  "markitdown[pdf,docx]>=0.1.9",
  "pyalex>=0.15",
  "habanero>=2.0",
]

[tool.uv]
package = false
