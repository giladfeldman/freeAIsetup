[project]
name = "metascience-course"
version = "1.0.0"
description = "Python environment for the meta-science course"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "openpyxl>=3.1",
  "requests>=2.32",
  "pymupdf>=1.24",
  # Microsoft C++ runtime files (MSVCP140.dll) without admin: a fresh Windows lacks them and pymupdf needs them
  "msvc-runtime>=14.40; sys_platform == 'win32'",
  "markitdown[pdf,docx]>=0.1.9",
  "pyalex>=0.15",
  "habanero>=2.0",
]

[tool.uv]
package = false
# Intel Macs (x86_64): the newest releases of these ship no Intel-Mac build and fail to build from source there
# (emulator, macOS 15.8.2 Intel, 2026-11-09). The limits apply only on Intel Macs.
constraint-dependencies = [
  "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "pymupdf<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]
