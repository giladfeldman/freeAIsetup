name = "freeaisetup-logs"
main = "src/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# Free plan only: Workers 100k requests/day, KV 1,000 writes/day. Over the limit, uploads fail; nothing is billed.
# Each failed report uses up to 4 KV writes (report, issue state, day counter, alert status); each counted install 2.

# EU only (2026-11-12): created with `wrangler kv namespace create freeaisetup-logs-eu --jurisdiction=eu`, so the
# data is stored in the EU. A jurisdiction can only be set when a namespace is created. The earlier namespace
# (freeaisetup-logs, 68e18a10d41843828b574d19f2cc4320, no jurisdiction) was copied here key by key.
[[kv_namespaces]]
binding = "LOGS"
id = "302605872288430c81dd4929190cadb9"

# One at a time (d-09bd19): every alert decision and the digest run in ONE Durable Object (AlertGate, src/index.js),
# so two reports at the same moment cannot both send an email or overwrite each other's counts. Created in the EU
# jurisdiction (src/index.js). SQLite-backed, which the Workers Free plan includes; it sleeps when idle (no
# always-on cost). Each failed report adds a few small writes to its storage (free plan: 100k a day).
[[durable_objects.bindings]]
name = "ALERTS"
class_name = "AlertGate"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AlertGate"]

# Admin alerts (admin email standard): an email per new failed report (src/alerts.js), and the fortnight digest
# on the 1st and 15th of each month at 06:00 UTC (07:00/08:00 in Innsbruck).
# Secrets (wrangler secret put): ADMIN_NOTIFY_EMAIL, SES_FROM, SES_ACCESS_KEY_ID, SES_SECRET_ACCESS_KEY,
# ADMIN_EMAIL_SESSION_FOLDER, ADMIN_LOG_URL. Without them the reports are still stored, and the failure is recorded.
[triggers]
crons = ["0 6 1,15 * *"]

[vars]
SES_REGION = "eu-west-1"
